<style>
  :root{
    --ink:#16202B;
    --ink-soft:#5c6a78;
    --indigo:#1B5FAE;
    --pink:#7A1F3D;
    --mint:#1E8A4C;
    --amber:#C9A227;
    --teal:#123C6B;
    --card:#FBF7EC;
    --line:#d9e2ea;
    --shadow: rgba(10,37,64,0.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; touch-action:manipulation;}
  html{height:100%; overscroll-behavior-y:none; touch-action:manipulation;}
  html{
    background:#eef0f6; /* filet de sécurité si jamais la div de fond ne charge pas */
  }
  body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    color:var(--ink);
    background:transparent;
    min-height:100%;
    position:relative;
    overscroll-behavior-y:none;
  }
  /* Div de fond ordinaire (pas sur html/body) : elle s'étire exactement sur
     toute la hauteur réelle du contenu, sans le comportement spécial "collé
     à l'écran" que les navigateurs appliquent au fond de l'élément racine. */
  #bg-decor{
    position:absolute; top:0; left:0; right:0; z-index:0; pointer-events:none;
    height:100vh;
    background:
      radial-gradient(38% 22% at 15% 6%, rgba(201,162,39,0.28), rgba(201,162,39,0) 70%),
      radial-gradient(45% 26% at 90% 9%, rgba(122,31,61,0.28), rgba(122,31,61,0) 70%),
      radial-gradient(50% 26% at 30% 97%, rgba(27,95,174,0.38), rgba(27,95,174,0) 70%),
      radial-gradient(45% 26% at 95% 94%, rgba(201,162,39,0.20), rgba(201,162,39,0) 70%),
      linear-gradient(180deg, #0A2540 0%, #0C1B2E 100%);
  }
  #app{
    width:100%;
    max-width:480px;
    margin:0 auto;
    padding:18px 18px calc(24px + env(safe-area-inset-bottom));
    position:relative;
    z-index:1;
  }
  /* En mode "app installée" (écran d'accueil), la barre de statut recouvre
     le contenu au lieu de le pousser : on ajoute la marge nous-mêmes.
     Ce bloc ne s'applique jamais dans un onglet de navigateur classique. */
  @media (display-mode: standalone){
    #app{
      padding-top: calc(18px + env(safe-area-inset-top));
    }
  }
  .quit-btn{
    position:fixed; top:16px; right:16px; width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,0.85); display:flex; align-items:center; justify-content:center;
    font-size:16px; box-shadow:0 4px 10px rgba(32,51,74,.25); z-index:60; cursor:pointer;
  }
  @media (display-mode: standalone){
    .quit-btn{ top: calc(16px + env(safe-area-inset-top)); }
  }
  .back-btn{
    position:fixed; top:16px; left:16px; width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,0.85); color:var(--ink); display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:800; box-shadow:0 4px 10px rgba(32,51,74,.25); z-index:60; cursor:pointer;
  }
  @media (display-mode: standalone){
    .back-btn{ top: calc(16px + env(safe-area-inset-top)); }
  }
  h1,h2,h3{font-family:-apple-system, 'SF Pro Display', sans-serif; margin:0;}
  .screen{
    position:relative; z-index:1; animation: pop .3s ease;
  }
  @keyframes pop{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  /* La page défile normalement : le titre en haut et le bouton en bas
     défilent avec le reste, comme une page web classique. */
  .scroll-area{}
  .scroll-area.center{text-align:center;}
  .fixed-part{}

  .title-row{display:flex; align-items:center; gap:10px; margin-bottom:2px;}
  .title-row span.emoji{font-size:26px;}
  h1.main{font-size:26px; color:#F2ECDC; font-weight:800; letter-spacing:-0.03em;}
  .subtitle{font-size:12.5px; font-weight:500; color:#AFC1D4; margin-top:1px; margin-bottom:12px;}

  .card{
    background:linear-gradient(180deg, #ffffff 0%, #fcfcfe 100%);
    border-radius:20px;
    padding:16px;
    box-shadow: 0 1px 2px var(--shadow), 0 8px 20px rgba(28,28,30,0.06);
    margin-bottom:12px;
    position:relative;
    border:1px solid rgba(28,28,30,0.04);
  }

  label.field-label{display:block; font-weight:800; font-size:12px; color:var(--ink-soft); margin-bottom:10px; letter-spacing:0.02em; text-transform:uppercase;}

  .stepper{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:12px;}
  .stepper button{
    width:40px; height:40px; border-radius:50%; border:none;
    background:linear-gradient(135deg, #4A8FD4 0%, var(--indigo) 100%); color:white; font-size:20px; font-weight:700;
    box-shadow:0 2px 6px rgba(27,95,174,0.4); cursor:pointer; transition:transform .1s, opacity .1s;
  }
  .stepper button:disabled{opacity:.3; cursor:not-allowed;}
  .stepper button:active{transform:scale(0.92);}
  .stepper .value{font-size:28px; font-weight:800; min-width:40px; text-align:center; letter-spacing:-0.02em;}

  .role-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line);}
  .role-row:last-child{border-bottom:none;}
  .role-row .label{font-weight:700; font-size:14px;}
  .role-row .desc{font-size:11px; color:var(--ink-soft); font-weight:500;}
  .mini-stepper{display:flex; align-items:center; gap:8px;}
  .mini-stepper button{
    width:30px; height:30px; border-radius:50%; border:none; background:#f0f0f4; color:var(--ink);
    font-size:16px; font-weight:700; cursor:pointer; transition:transform .1s;
  }
  .mini-stepper button:disabled{opacity:.3; cursor:not-allowed;}
  .mini-stepper button:active{transform:scale(0.9);}
  .mini-stepper .value{min-width:20px; text-align:center; font-weight:700; font-size:15px;}
  /* Chaque rôle a sa propre couleur, reprise partout (icône, compteur, badge) */
  .role-row.role-civil .role-icon{background:#DEF7E5;}
  .role-row.role-undercover .role-icon{background:#FFE1E8;}
  .role-row.role-mrwhite .role-icon{background:#EAE7FF;}
  .role-icon{
    width:34px; height:34px; border-radius:10px; display:inline-flex; align-items:center;
    justify-content:center; font-size:16px; margin-right:2px;
  }
  .mini-stepper.tint-undercover button:not(:disabled){background:#FFE1E8; color:#C23A66;}
  .mini-stepper.tint-mrwhite button:not(:disabled){background:#EAE7FF; color:#5C3FCC;}
  .switch{position:relative; width:46px; height:27px; border-radius:20px; background:#e2e2e7; cursor:pointer; transition:.2s; flex-shrink:0;}
  .switch.on{background:var(--mint);}
  .switch .knob{position:absolute; top:2.5px; left:2.5px; width:22px; height:22px; border-radius:50%; background:white; transition:.2s; box-shadow:0 2px 4px rgba(0,0,0,.2);}
  .switch.on .knob{left:21.5px;}
  .player-row.dragging{opacity:.9; box-shadow:0 10px 24px rgba(28,28,30,.18); background:#fbfbfd; border-radius:14px;}
  .drag-handle{user-select:none;}

  .name-field-wrap{position:relative; margin-bottom:8px;}
  input.name-input{
    width:100%; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line);
    font-size:14px; font-weight:600; font-family:inherit; background:#fafafc;
  }
  input.name-input:focus{outline:none; border-color:var(--indigo);}
  .suggestions{
    position:absolute; left:0; right:0; top:calc(100% + 4px); background:white; border-radius:14px;
    box-shadow:0 8px 20px rgba(28,28,30,.18); z-index:30; overflow-y:auto; max-height:240px; display:none;
  }
  .suggestion-item{
    display:flex; justify-content:space-between; align-items:center; padding:9px 14px;
    font-weight:600; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line);
  }
  .suggestion-item:last-child{border-bottom:none;}
  .suggestion-item:active{background:#f5f5f8;}
  .sugg-stats{font-size:10px; color:var(--ink-soft); font-weight:600;}
  .suggestion-group-label{
    padding:8px 14px 4px; font-size:10px; font-weight:800; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:0.03em; background:#fafafc;
  }

  .btn{
    display:block; width:100%; text-align:center; padding:13px; border-radius:16px;
    font-family:inherit; font-size:15px; font-weight:700; border:none; cursor:pointer; color:white;
    user-select:none; transition:transform .1s, opacity .1s;
  }
  .btn:active{transform:scale(0.97); opacity:.9;}
  .btn-primary{background:linear-gradient(135deg, #A8375C 0%, var(--pink) 100%); box-shadow:0 4px 14px rgba(122,31,61,0.4);}
  .btn-secondary{background:linear-gradient(135deg, #4A8FD4 0%, var(--indigo) 100%); box-shadow:0 4px 14px rgba(27,95,174,0.4);}
  .btn-ghost{background:#f0f0f4; color:var(--ink); box-shadow:none;}

  .center{text-align:center;}

  .reveal-wrap{display:flex; flex-direction:column; align-items:center; margin-top:4px;}
  .avatar-badge{
    width:52px; height:52px; border-radius:50%; background:var(--indigo); color:white;
    display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800;
    margin-bottom:6px; box-shadow:0 4px 10px rgba(27,95,174,0.4);
  }

  /* Paquet de cartes : toujours autant de cartes que de joueurs, elles ne disparaissent jamais */
  .deck-grid{display:flex; gap:10px; justify-content:center; align-items:center; margin:18px 0; flex-wrap:wrap; width:100%;}
  .deck-card{
    position:relative;
    width:64px; height:90px; border-radius:18px; cursor:pointer;
    background:linear-gradient(155deg, #4A8FD4 0%, var(--indigo) 55%, #0A2540 100%);
    color:white;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 4px var(--shadow), 0 10px 20px rgba(94,92,230,.28);
    border:1px solid rgba(255,255,255,0.25);
    transition:transform .12s, box-shadow .12s;
  }
  .deck-card:active{transform:scale(0.93);}
  .deck-card.used{
    background:#e2e2e7; box-shadow:none; border-color:transparent;
  }
  .deck-card.used .deck-card-icon{opacity:.35;}
  .deck-card-icon{width:32px; height:32px;}
  .deck-card-check{font-size:24px;}

  /* Grande carte retournée : le mot doit se voir grand et net */
  .big-flip{width:240px; height:300px; perspective:1000px; margin:6px auto;}
  .big-flip .flip-inner{position:relative; width:100%; height:100%; transition: transform .5s; transform-style:preserve-3d;}
  .big-flip.flipped .flip-inner{transform:rotateY(180deg);}
  .big-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:24px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px;
    box-shadow:0 2px 4px var(--shadow), 0 10px 24px rgba(28,28,30,.16); text-align:center;
  }
  .big-front{background:linear-gradient(160deg, var(--indigo), #0A2540); color:white; font-size:56px;}
  .big-back{background:var(--card); transform:rotateY(180deg);}
  .big-back .word{font-weight:800; color:var(--ink); line-height:1.15; word-break:break-word;}
  .big-back .icon{font-size:44px; margin-bottom:8px;}

  .players-list{display:flex; flex-direction:column; gap:8px;}
  .player-btn{

// ---------- Historique des joueurs (en mémoire, le temps de la session) ----------
let roster = [];

// ---------- Sauvegarde persistante du classement (localStorage) ----------
// Contrairement au reste (partie en cours, etc.), le classement des joueurs
// doit survivre à la fermeture de l'app, pas seulement rester en mémoire le
// temps que l'onglet reste ouvert.
const ROSTER_STORAGE_KEY = 'demasque_roster_v1';

function saveRosterToStorage(){
  try{
    localStorage.setItem(ROSTER_STORAGE_KEY, JSON.stringify(roster));
  }catch(e){
    // Stockage indisponible (navigation privée, quota plein...) : on continue
    // sans sauvegarder plutôt que de planter le jeu.
  }
}

function loadRosterFromStorage(){
  try{
    const saved = localStorage.getItem(ROSTER_STORAGE_KEY);
    if(saved){
      const parsed = JSON.parse(saved);
      if(Array.isArray(parsed)) roster = parsed;
    }
  }catch(e){
    roster = [];
  }
}
loadRosterFromStorage();

// ---------- Pioche de mots sans répétition (une pile distincte par niveau) ----------
// On mélange toute la liste, on tire dedans une par une, et on ne remélange
// que lorsqu'on est passé par tous les mots : jamais 2 fois le même trop vite.
let wordQueues = { kids: [], ados: [], adults: [] };

function wordFontSize(word, base){
  base = base || 24;
  const len = (word || '').length;
  if(len > 20) return Math.round(base * 0.55);
  if(len > 14) return Math.round(base * 0.7);
  if(len > 9) return Math.round(base * 0.85);
  return base;
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function drawWordPair(avoidPair){
  const level = state.wordLevel || 'kids';
  const pairsForLevel = (WORD_LEVELS[level] || WORD_LEVELS.kids).pairs;
  if(!wordQueues[level] || wordQueues[level].length === 0){
    wordQueues[level] = shuffleArray(pairsForLevel);
  }
  let pair = wordQueues[level].pop();
  // sécurité : si jamais on retombe pile sur le mot qu'on vient de jouer
  // (possible seulement au moment où la pioche se remélange), on en reprend un autre
  if(avoidPair && pair[0] === avoidPair[0] && wordQueues[level].length > 0){
    const other = wordQueues[level].pop();
    wordQueues[level].unshift(pair);
    pair = other;
  }
  return pair;
}

function getOrCreateRosterEntry(name){
  if(!name) return null;
  let entry = roster.find(r => r.name.toLowerCase() === name.toLowerCase());
  if(!entry){
    entry = { name: name, parties: 0, points: 0, lastPlayedAt: Date.now() };
    roster.push(entry);
  } else {
    entry.lastPlayedAt = Date.now();
  }
  saveRosterToStorage();
  return entry;
}

// ---------- State ----------

  screen: 'setup',
  numPlayers: 5,
  numUndercover: 1,
  numMrWhite: 1,
  names: ["","","","",""],

  revealIndex: 0,
  revealed: false,

  civilWord: null,
  undercoverWord: null,
  starterId: null,

  wordLevel: 'kids',
  revealOrder: [],
  roundNumber: 1,
  lastEliminatedId: null,
  pendingPlayers: [],
  winner: null
};

function syncNamesArray(){
  const n = state.numPlayers;
  while(state.names.length < n) state.names.push("");
  // Pas de troncature : si on réduit puis remonte le nombre de joueurs, les
  // prénoms déjà tapés au-delà du nombre actuel restent en mémoire au lieu
  // d'être perdus.
}

// À 3 joueurs, un seul rôle spécial (infiltré OU Bluffeur) est autorisé à la
// fois : impossible d'avoir les deux en même temps. Au-delà, la seule règle
// est de garder au moins 1 civil.
function maxSpecialTotal(){
  // Même ratio que le vrai jeu Undercover : jusqu'à la moitié des joueurs
  // peuvent être des rôles spéciaux (infiltré + Bluffeur).
  // Ex : 6 joueurs -> 3, 8 -> 4, 10 -> 5, 12 -> 6.
  return Math.floor(state.numPlayers / 2);
}

function clampRoles(){
  const max = maxSpecialTotal();
  while(state.numUndercover + state.numMrWhite > max && (state.numUndercover > 0 || state.numMrWhite > 0)){
    if(state.numMrWhite > 0) state.numMrWhite--;
    else state.numUndercover--;
  }
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.screen === 'setup') app.appendChild(renderSetup());
  if(state.screen === 'reveal') app.appendChild(renderReveal());
  if(state.screen === 'starter') app.appendChild(renderStarter());
  if(state.screen === 'discussion') app.appendChild(renderDiscussion());
  if(state.screen === 'result') app.appendChild(renderResult());

  if(state.screen !== 'setup'){
    const quit = document.createElement('div');
    quit.textContent = '✖️';
    quit.title = 'Quitter la partie';
    quit.className = 'quit-btn';
    quit.onclick = showQuitConfirm;
    app.appendChild(quit);
  }

  syncBgHeight();
}

// Calcule la vraie hauteur du contenu (via JS, pas via le %CSS qui se
// comporte différemment selon les écrans/navigateurs) et l'applique au
// fond, pour qu'il couvre toujours toute la page, sur chaque écran.
function syncBgHeight(){
  const bg = document.getElementById('bg-decor');
  if(!bg) return;
  // On repart d'une hauteur neutre avant de mesurer, sinon l'ancienne
  // valeur peut fausser la mesure du scrollHeight réel du document.
  bg.style.height = '100vh';
  requestAnimationFrame(() => {
    const h = Math.max(
      document.documentElement.scrollHeight,
      document.body.scrollHeight,
      window.innerHeight
    );
    bg.style.height = h + 'px';
  });
}

window.addEventListener('resize', syncBgHeight);
window.addEventListener('orientationchange', syncBgHeight);

function showQuitConfirm(){
  const bg = el('div','modal-bg');
  const modal = el('div','modal');
  modal.appendChild(el('h3', null, '🚪 Quitter la partie ?'));
  modal.appendChild(el('p', null, 'Tu vas revenir au menu principal. La partie en cours sera perdue.'));
  const yesBtn = el('div','btn btn-primary','Oui, quitter');
  yesBtn.onclick = () => { bg.remove(); state.screen = 'setup'; render(); };
  modal.appendChild(yesBtn);
  const noBtn = el('div','btn btn-ghost','Annuler');
  noBtn.style.marginTop = '10px';
  noBtn.onclick = () => bg.remove();
  modal.appendChild(noBtn);
  bg.appendChild(modal);
  document.body.appendChild(bg);
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

// Accord simple du pluriel (ajoute un "s" seulement si count > 1)
function plural(count, word){
  return word + (count > 1 ? 's' : '');
}

// Échappe le HTML dans un texte fourni par l'utilisateur (prénom...) avant de
// l'insérer via innerHTML, pour qu'un prénom du style "<b>Test</b>" s'affiche
// tel quel au lieu d'être interprété comme du vrai code HTML.
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

// Empêche un double-tap accidentel de déclencher deux fois une action qui
// fait avancer la partie (élimination, changement d'écran...).
function guardOnce(fn){
  let done = false;
  return (...args) => {
    if(done) return;
    done = true;
    fn(...args);
  };
}

// Normalise un mot pour la comparaison (minuscules, sans accents, espaces
// superflus retirés) : le Bluffeur ne doit pas perdre juste parce qu'il a
// oublié un accent ou tapé en majuscules.
function normalizeWord(str){
  return (str || '')
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ');
}

let toastTimer = null;
function showToast(message){
  let toast = document.getElementById('app-toast');
  if(!toast){
    toast = el('div', null, '');
    toast.id = 'app-toast';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  clearTimeout(toastTimer);
  // reflow pour redéclencher l'animation même si un toast est déjà affiché
  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');
  toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2600);
}

function createRoleStepper(value, onChange, getMax){
  const wrap = el('div','mini-stepper');
  const max = Math.max(0, getMax());
  const minus = el('button', null, '−');
  const val = el('div','value', value);
  const plus = el('button', null, '+');
  minus.disabled = value <= 0;
  plus.disabled = value >= max;
  minus.onclick = () => { if(value>0){ onChange(value-1); render(); } };
  plus.onclick = () => { if(value<max){ onChange(value+1); render(); } };
  wrap.appendChild(minus); wrap.appendChild(val); wrap.appendChild(plus);
  return wrap;
}

function createNameField(i){
  const wrapper = el('div','name-field-wrap');
  const input = document.createElement('input');
  input.className = 'name-input';
  input.type = 'text';
  input.autocomplete = 'off';
  input.value = state.names[i] || '';
  input.placeholder = 'Joueur ' + (i+1);
  wrapper.appendChild(input);

  const sugg = el('div','suggestions');
  wrapper.appendChild(sugg);

  function updateSuggestions(){
    const q = input.value.trim().toLowerCase();
    const matches = roster
      .filter(r => r.name.toLowerCase().includes(q))
      .filter(r => r.name.toLowerCase() !== q)
      .sort((a,b) => (b.lastPlayedAt||0) - (a.lastPlayedAt||0)); // les derniers joueurs en premier, liste complète (pas de plafond)
    if(matches.length === 0){
      sugg.style.display = 'none';
      sugg.innerHTML = '';
      return;
    }
    sugg.innerHTML = '';

    function addItem(r){
      const item = el('div','suggestion-item');
      item.innerHTML = '<span>' + escapeHtml(r.name) + '</span><span class="sugg-stats">' + r.parties + ' parties · ' + r.points + ' pts</span>';
      item.onmousedown = (ev) => {
        ev.preventDefault();
        input.value = r.name;
        state.names[i] = r.name;
        sugg.style.display = 'none';
        sugg.innerHTML = '';
      };
      sugg.appendChild(item);
    }

    // Sans recherche en cours : on sépare "derniers joueurs" (les 3 plus
    // récents) du reste de la liste, classé par ordre alphabétique.
    if(q === '' && matches.length > 3){
      const recent = matches.slice(0,3);
      const others = matches.slice(3).sort((a,b) => a.name.localeCompare(b.name));
      sugg.appendChild(el('div','suggestion-group-label','🕒 Derniers joueurs'));
      recent.forEach(addItem);
      sugg.appendChild(el('div','suggestion-group-label','👥 Tous les joueurs'));
      others.forEach(addItem);
    } else {
      matches.forEach(addItem);
    }
    sugg.style.display = 'block';
  }

  input.oninput = () => { state.names[i] = input.value; updateSuggestions(); };
  input.onfocus = () => { updateSuggestions(); };
  input.onblur = () => { setTimeout(() => { sugg.style.display = 'none'; }, 150); };

  return wrapper;
}

function startGame(){
  // Fusionne les joueurs en attente (ajoutés en cours de manche précédente)
  if(state.pendingPlayers && state.pendingPlayers.length){
    state.pendingPlayers.forEach(pp => {
      state.names.push(pp.name);
      state.numPlayers++;
    });
    state.pendingPlayers = [];
    clampRoles();
  }

  const civilCount = state.numPlayers - state.numUndercover - state.numMrWhite;
  const missingNames = state.names.slice(0, state.numPlayers).some(n => !n || !n.trim());
  if(missingNames){ showToast("✏️ Merci d'écrire le prénom de chaque joueur avant de commencer !"); return; }

  // Deux joueurs avec le même prénom fausseraient le tableau des scores
  // (impossible de les distinguer) : on demande un prénom différent.
  const namesTrimmed = state.names.slice(0, state.numPlayers).map(n => n.trim().toLowerCase());
  const hasDuplicateNames = namesTrimmed.some((n, i) => namesTrimmed.indexOf(n) !== i);
  if(hasDuplicateNames){ showToast('👥 Deux joueurs ont le même prénom ! Ajoute une initiale pour les distinguer (ex : "Léa B.").'); return; }

  if(state.numUndercover + state.numMrWhite < 1){ alert("Choisis au moins 1 infiltré ou 1 Bluffeur pour commencer !"); return; }
  if(civilCount < 1){ alert("Il faut garder au moins 1 civil ! Réduis le nombre d'infiltrés ou de Bluffeurs."); return; }

  const pair = drawWordPair(state.civilWord ? [state.civilWord, state.undercoverWord] : null);
  const [civilWord, undercoverWord] = pair;

  // Pioche 100% aléatoire : on mélange un vrai paquet de rôles (Fisher-Yates)
  let roles = [];
  for(let i=0;i<civilCount;i++) roles.push('civil');
  for(let i=0;i<state.numUndercover;i++) roles.push('undercover');
  for(let i=0;i<state.numMrWhite;i++) roles.push('mrwhite');
  for(let i=roles.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [roles[i],roles[j]]=[roles[j],roles[i]]; }

  state.players = [];
  for(let i=0;i<state.numPlayers;i++){
    const finalName = (state.names[i] && state.names[i].trim()) ? state.names[i].trim() : ('Joueur ' + (i+1));
    state.names[i] = finalName;
    getOrCreateRosterEntry(finalName);
    state.players.push({ id: 'p_' + i + '_' + Math.random().toString(36).slice(2,7), name: finalName, role: roles[i], word: roles[i]==='civil' ? civilWord : (roles[i]==='undercover' ? undercoverWord : null), eliminated:false });
  }

  // L'ordre autour de la table est fixe (ordre de saisie des joueurs), mais le
  // point de départ change à chaque partie : ce n'est pas toujours le même
  // joueur qui pioche (et décrit) en premier. Un infiltré peut toujours
  // commencer sans souci ; seul le Bluffeur (qui n'a pas de mot) est
  // exclu par défaut, sauf si le réglage l'autorise.
  const startCandidates = state.allowBluffeurStarter
    ? state.players.map((p,i) => i)
    : state.players.map((p,i) => p.role !== 'mrwhite' ? i : null).filter(i => i !== null);
  const validStarts = startCandidates.length > 0 ? startCandidates : state.players.map((p,i) => i);
  const startIdx = validStarts[Math.floor(Math.random()*validStarts.length)];
  state.revealOrder = buildRotationOrder(startIdx, state.players.length);
  state.usedCardSlots = new Array(state.revealOrder.length).fill(false);
  state.starterId = state.players[startIdx].id; // le premier à piocher est aussi le premier à décrire

  state.civilWord = civilWord;
  state.undercoverWord = undercoverWord;
  state.revealIndex = 0;
  state.revealed = false;
  state.chosenCard = null;
  state.roundNumber = 1;
  state.lastEliminatedId = null;
  state.screen = 'reveal';
  render();
}

function buildRotationOrder(startIdx, n){
  const order = [];
  for(let i=0;i<n;i++) order.push((startIdx + i) % n);
  return order;
}

// ---------- REVEAL SCREEN : pioche de carte ----------
function deckCardIconSvg(){
  return '<svg class="deck-card-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<circle cx="15" cy="13" r="7" fill="white" fill-opacity="0.95"/>' +
    '<path d="M3 33c0-8 6-13 12-13s12 5 12 9" fill="white" fill-opacity="0.95"/>' +
    '<circle cx="29" cy="10" r="9" fill="#FFD60A"/>' +
    '<text x="29" y="15" font-size="13" font-weight="800" text-anchor="middle" fill="#20334A" font-family="-apple-system, sans-serif">?</text>' +
    '</svg>';
}

function renderReveal(){
  const wrap = el('div','screen');
  const playerIdx = state.revealOrder[state.revealIndex];
  const p = state.players[playerIdx];
  const totalCards = state.revealOrder.length; // toujours autant de cartes que de joueurs

  wrap.appendChild(el('div','subtitle fixed-part', '📱 Passe le téléphone !'));

  const scrollArea = el('div','scroll-area center');
  const revealWrap = el('div','reveal-wrap');
  const badge = el('div','avatar-badge', p.name.charAt(0).toUpperCase());
  revealWrap.appendChild(badge);
  revealWrap.appendChild(el('h2', null, p.name));

  if(state.chosenCard === null){
    // Le paquet garde toujours le même nombre de cartes : celles déjà
    // prises restent visibles, juste grisées, elles ne disparaissent pas.
    const grid = el('div','deck-grid');
    // Nombre de cartes par ligne selon le nombre de joueurs :
    // 3-4 joueurs -> 2 par ligne, 5-9 -> 3 par ligne, 10-12 -> 4 par ligne.
    let perRow;
    if(totalCards <= 4) perRow = 2;
    else if(totalCards <= 9) perRow = 3;
    else perRow = 4;
    // Largeur réellement disponible sur CET écran (pas une valeur devinée à
    // l'avance) : #app fait au plus 480px de large, avec 18px de marge de
    // chaque côté. On retire encore un peu de marge de sécurité pour éviter
    // qu'un écran étroit ne fasse basculer une carte à la ligne suivante.
    const containerWidth = Math.min(480, window.innerWidth) - (18*2) - 6;
    const cardW = Math.min(130, Math.floor((containerWidth - (perRow-1)*14) / perRow));
    const cardH = Math.round(cardW * 1.2);
    grid.style.gap = '14px';
    for(let c=0;c<totalCards;c++){
      const isUsed = !!state.usedCardSlots[c];
      const card = el('div','deck-card' + (isUsed ? ' used' : ''), isUsed ? '<span class="deck-card-check">✅</span>' : deckCardIconSvg());
      card.style.width = cardW + 'px';
      card.style.height = cardH + 'px';
      if(!isUsed){
        const iconEl = card.querySelector('.deck-card-icon');
        if(iconEl){ const iconSize = Math.round(cardW * 0.5); iconEl.style.width = iconSize + 'px'; iconEl.style.height = iconSize + 'px'; }
        card.onclick = () => {
          state.usedCardSlots[c] = true;
          state.chosenCard = c;
          state.revealed = true;
          render();
        };
      }
      grid.appendChild(card);
    }
    revealWrap.appendChild(grid);
  } else {
    // Grande carte retournée, mot bien lisible
    const big = el('div','big-flip flipped');
    const inner = el('div','flip-inner');
    const front = el('div','big-face big-front','🎴');
    const back = el('div','big-face big-back');
    if(p.role === 'mrwhite'){
      back.innerHTML = '<div class="icon">🤍</div><div class="word">Bluffeur</div>';
    } else {
      back.innerHTML = '<div class="word" style="font-size:' + wordFontSize(p.word, 36) + 'px;">' + p.word + '</div>';
    }
    inner.appendChild(front); inner.appendChild(back);
    big.appendChild(inner);
    revealWrap.appendChild(big);

    if(p.role === 'mrwhite'){
      revealWrap.appendChild(el('div','footer-note footer-note-dark', "🤫 Tu n'as pas de mot ! Écoute bien les autres et fais semblant."));
    } else {
      revealWrap.appendChild(el('div','footer-note footer-note-dark', "Décris ce mot sans jamais le dire !"));
    }
  }

  scrollArea.appendChild(revealWrap);
  wrap.appendChild(scrollArea);

  const footer = el('div','fixed-part');
  const btn = el('div','btn ' + (state.revealed ? 'btn-primary' : 'btn-ghost'),
    state.revealed ? "J'ai vu, cacher et continuer ➡️" : "🎴 Choisis une carte du paquet");
  btn.onclick = () => {
    if(!state.revealed) return;
    state.revealed = false;
    state.chosenCard = null;
    if(state.revealIndex < state.revealOrder.length - 1){
      state.revealIndex++;
      render();
    } else {
      // Le joueur qui a pioché en premier est aussi celui qui décrit en premier
      state.screen = 'starter';
      render();
    }
  };
  footer.appendChild(btn);
  footer.appendChild(el('div','footer-note footer-note-dark', 'Joueur ' + (state.revealIndex+1) + ' / ' + state.revealOrder.length));

  if(state.revealIndex >= 1 && state.chosenCard === null){
    const reroll = el('div','btn btn-ghost','🔄 Mot trop dur ? En tirer un autre');
    reroll.style.marginTop = '8px';
    reroll.onclick = rerollWord;
    footer.appendChild(reroll);
  }
  wrap.appendChild(footer);

  return wrap;
}

function rerollWord(){
  const pair = drawWordPair([state.civilWord, state.undercoverWord]);
  const [civilWord, undercoverWord] = pair;
  state.civilWord = civilWord;
  state.undercoverWord = undercoverWord;
  state.players.forEach(p => {
    if(p.role === 'civil') p.word = civilWord;
    else if(p.role === 'undercover') p.word = undercoverWord;
  });
  state.revealIndex = 0;
  state.revealed = false;
  state.chosenCard = null;
  // Nouveau mot = nouvelle manche de pioche : le paquet redevient entièrement
  // vierge, aucune carte ne doit rester marquée comme déjà prise.
  state.usedCardSlots = new Array(state.revealOrder.length).fill(false);
  render();
}

// ---------- STARTER SCREEN : le jeu tire au sort qui commence ----------
function getSpeakingOrder(startId){
  const n = state.players.length;
  let startIdx = state.players.findIndex(p => p.id === startId);
  if(startIdx === -1) startIdx = 0; // filet de sécurité si le joueur n'existe plus (supprimé)
  const order = [];
  for(let i=0;i<n;i++){
    const idx = (startIdx + i) % n;
    const p = state.players[idx];
    if(!p.eliminated) order.push(p);
  }
  return order;
}

function spawnConfetti(colors){

function showManagePlayers(){
  const bg = el('div','modal-bg');
  const modal = el('div','modal');
  modal.style.maxHeight = '85vh';
  modal.style.overflowY = 'auto';
  modal.appendChild(el('h3', null, '⚙️ Gérer les joueurs'));
  modal.appendChild(el('p', null, 'Reste appuyé sur ⠿ pour déplacer un joueur (échanger leur place), modifie un nom, ou ajoute/supprime un joueur.'));

  const list = el('div','players-list');
  let dragId = null;
  let dragStartY = 0;
  let changed = false;

  function getRowEl(id){
    return list.querySelector('[data-player-id="' + id + '"]');
  }

  function onPointerMove(e){
    if(!dragId) return;
    const row = getRowEl(dragId);
    if(!row) return;
    row.style.transform = 'translateY(' + (e.clientY - dragStartY) + 'px)';
    row.style.zIndex = '5';

    const overEl = document.elementFromPoint(e.clientX, e.clientY);
    const overRow = overEl ? overEl.closest('.player-row') : null;
    if(overRow && overRow.dataset.playerId && overRow.dataset.playerId !== dragId){
      const fromIdx = state.players.findIndex(p => p.id === dragId);
      const toIdx = state.players.findIndex(p => p.id === overRow.dataset.playerId);
      if(fromIdx > -1 && toIdx > -1){
        const [moved] = state.players.splice(fromIdx, 1);
        state.players.splice(toIdx, 0, moved);
        changed = true;
        dragStartY = e.clientY;
        refreshList();
        const newRow = getRowEl(dragId);
        if(newRow){ newRow.style.transform = 'translateY(0px)'; newRow.classList.add('dragging'); }
      }
    }
  }

  function onPointerUp(){
    if(dragId){
      const row = getRowEl(dragId);
      if(row){ row.style.transform = ''; row.style.zIndex = ''; row.classList.remove('dragging'); }
    }
    dragId = null;
    document.removeEventListener('pointermove', onPointerMove);
    document.removeEventListener('pointerup', onPointerUp);
  }

  function refreshList(){
    list.innerHTML = '';
    state.players.forEach((p) => {
      const row = el('div','name-field-wrap player-row');
      row.dataset.playerId = p.id;
      row.style.display = 'flex';
      row.style.gap = '8px';
      row.style.alignItems = 'center';
      row.style.transition = 'transform .15s';

      const handle = document.createElement('div');
      handle.textContent = '⠿';
      handle.className = 'drag-handle';
      handle.style.fontSize = '22px';
      handle.style.color = '#aab4c2';
      handle.style.cursor = 'grab';
      handle.style.padding = '6px 4px';
      handle.style.touchAction = 'none';
      handle.onpointerdown = (e) => {
        e.preventDefault();
        dragId = p.id;
        dragStartY = e.clientY;
        row.classList.add('dragging');
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
      };
      row.appendChild(handle);

      const input = document.createElement('input');
      input.className = 'name-input';
      input.type = 'text';
      input.value = p.name;
      input.style.flex = '1';
      input.onchange = () => {
        const newName = input.value.trim();
        if(!newName || newName === p.name){ input.value = p.name; return; }
        const otherNames = state.players.filter(pl => pl.id !== p.id).map(pl => pl.name.toLowerCase());
        if(otherNames.includes(newName.toLowerCase())){
          alert('Ce prénom est déjà utilisé par un autre joueur !');
          input.value = p.name;
          return;
        }
        p.name = newName; changed = true;
      };
      row.appendChild(input);

      const delBtn = document.createElement('button');
      delBtn.textContent = '🗑️';
      delBtn.style.width = '44px';
      delBtn.style.height = '44px';
      delBtn.style.border = 'none';
      delBtn.style.borderRadius = '12px';
      delBtn.style.background = '#FDE3EA';
      delBtn.style.fontSize = '18px';
      delBtn.style.cursor = 'pointer';
      delBtn.onclick = () => {
        if(state.players.length <= 3){ alert('Il faut garder au moins 3 joueurs.'); return; }
        const idx = state.players.findIndex(pl => pl.id === p.id);
        if(idx > -1) state.players.splice(idx, 1);
        changed = true;
        refreshList();
      };
      row.appendChild(delBtn);

      list.appendChild(row);
    });

    if(state.pendingPlayers.length > 0){
      const pendingLabel = el('div','field-label','🕒 Rejoindront à la prochaine manche');
      pendingLabel.style.marginTop = '16px';
      list.appendChild(pendingLabel);
      state.pendingPlayers.forEach((pp) => {
        const prow = el('div','name-field-wrap');
        prow.style.display = 'flex';
        prow.style.gap = '8px';
        prow.style.alignItems = 'center';
        prow.style.opacity = '.7';
        const label = el('div', null, '⏳ ' + escapeHtml(pp.name));
        label.style.flex = '1';
        label.style.fontWeight = '700';
        label.style.padding = '10px 4px';
        prow.appendChild(label);
        const cancelBtn = document.createElement('button');
        cancelBtn.textContent = '🗑️';
        cancelBtn.style.width = '44px';
        cancelBtn.style.height = '44px';
        cancelBtn.style.border = 'none';
        cancelBtn.style.borderRadius = '12px';
        cancelBtn.style.background = '#FDE3EA';
        cancelBtn.style.fontSize = '18px';
        cancelBtn.style.cursor = 'pointer';
        cancelBtn.onclick = () => {
          state.pendingPlayers = state.pendingPlayers.filter(x => x.id !== pp.id);
          refreshList();
        };
        prow.appendChild(cancelBtn);
        list.appendChild(prow);
      });
    }
  }
  refreshList();
  modal.appendChild(list);

  const addBtn = el('div','btn btn-secondary','➕ Ajouter un joueur');
  addBtn.style.marginTop = '14px';
  addBtn.onclick = () => {
    if(state.players.length + state.pendingPlayers.length >= 12){ alert('Maximum 12 joueurs.'); return; }
    const name = prompt('Prénom du nouveau joueur :');
    if(!name || !name.trim()) return;
    const existingNames = state.players.map(p => p.name.toLowerCase())
      .concat(state.pendingPlayers.map(p => p.name.toLowerCase()));
    if(existingNames.includes(name.trim().toLowerCase())){
      alert('Ce prénom est déjà utilisé par un autre joueur ! Ajoute une initiale pour le distinguer (ex : "Léa B.").');
      return;
    }
    state.pendingPlayers.push({
      id: 'pending_' + Math.random().toString(36).slice(2,7),
      name: name.trim()
    });
    refreshList();
  };
  modal.appendChild(addBtn);
  modal.appendChild(el('div','footer-note','Un joueur ne peut pas rejoindre en pleine manche (il n\'a pas de mot). Il attend automatiquement la prochaine manche, sauf si tu choisis de relancer tout de suite.'));

  const closeBtn = el('div','btn btn-primary','Terminé');
  closeBtn.style.marginTop = '14px';
  closeBtn.onclick = () => {
    bg.remove();
    if(changed){ syncNamesFromPlayers(); }
    if(state.pendingPlayers.length > 0){ showApplyChangesChoice(); }
    else { render(); }
  };
  modal.appendChild(closeBtn);

  bg.appendChild(modal);
  document.body.appendChild(bg);
}

function showEliminationResult(p){
  const bg = el('div','modal-bg');
  const modal = el('div','modal');
  const roleLabel = p.role==='civil' ? '👨‍👩‍👧 Civil' : (p.role==='undercover' ? '🕶️ Infiltré' : '🤍 Bluffeur');
  const badgeClass = p.role==='civil' ? 'civil' : (p.role==='undercover' ? 'undercover' : 'mrwhite');

  // Calcul unique, valable pour les 3 rôles : est-ce que CETTE élimination
  // termine déjà la partie (dans un sens ou dans l'autre) ?
  const active = state.players.filter(pl => !pl.eliminated);
  const civilsNow = active.filter(pl => pl.role==='civil').length;
  const infiltresNow = active.filter(pl => pl.role==='undercover' || pl.role==='mrwhite').length;
  const civilsWinNow = infiltresNow === 0;
  const infiltresWinNow = !civilsWinNow && (civilsNow <= 1 ? infiltresNow >= civilsNow : infiltresNow > civilsNow);
  const gameEndsNow = civilsWinNow || infiltresWinNow;

  let outcomeHtml;
  if(p.role === 'civil'){
    if(infiltresWinNow){
      outcomeHtml = '<p style="margin-top:12px;font-weight:800;color:var(--pink);">❌ Non, ce n\'était qu\'un Civil ! Les infiltrés sont maintenant trop nombreux, ils remportent la partie.</p>';
    } else {
      outcomeHtml = '<p style="margin-top:12px;font-weight:800;color:var(--pink);">❌ Non, ce n\'était qu\'un Civil ! Refaites un tour, chacun donne un nouvel indice.</p>';
    }
  } else {
    const roleWord = p.role==='undercover' ? 'un Infiltré' : 'le Bluffeur';
    if(civilsWinNow){
      outcomeHtml = '<p style="margin-top:12px;font-weight:800;color:var(--mint);">✅ Bien joué, c\'était ' + roleWord + ' ! Tous les infiltrés sont démasqués, les civils gagnent !</p>';
    } else {
      outcomeHtml = '<p style="margin-top:12px;font-weight:800;color:var(--mint);">✅ Bien joué, c\'était ' + roleWord + ' ! Encore ' + infiltresNow + ' ' + (infiltresNow>1 ? 'suspects (infiltré ou Bluffeur) à démasquer' : 'suspect (infiltré ou Bluffeur) à démasquer') + '.</p>';
    }
  }

  // Cette phrase n'a de sens que si la partie continue : si elle se termine
  // ici, les mots sont révélés tout de suite sur l'écran suivant, pas "à la fin".
  const footerNote = gameEndsNow ? '' : '<p style="margin-top:8px;">Le mot sera révélé à la fin de la manche.</p>';

  modal.innerHTML = '<h3>' + escapeHtml(p.name) + ' est éliminé(e) !</h3>' +
    '<span class="badge ' + badgeClass + '">' + roleLabel + '</span>' +
    outcomeHtml +
    footerNote;
  const btn = el('div','btn btn-primary','Continuer ➡️');
  btn.onclick = guardOnce(() => { bg.remove(); checkWinConditionOrContinue(); });
  modal.appendChild(btn);
  bg.appendChild(modal);
  document.body.appendChild(bg);
}

function showMrWhiteGuessModal(idx){
  const bg = el('div','modal-bg');
  const modal = el('div','modal');
  modal.innerHTML = '<h3>🤍 Bluffeur démasqué !</h3><p>Il a droit à une dernière chance : quel est le mot des civils ?</p>';
  const input = el('input','name-input');
  input.placeholder = 'Sa réponse...';
  modal.appendChild(input);
  const btn = el('div','btn btn-secondary','Valider la réponse');
  btn.onclick = guardOnce(() => {
    const correct = normalizeWord(input.value) === normalizeWord(state.civilWord);
    bg.remove();
    if(correct){
      finishGame('mrwhite');
    } else {
      showEliminationResult(state.players[idx]);
    }
  });
  modal.appendChild(btn);
  bg.appendChild(modal);
  document.body.appendChild(bg);
}

function getNextActivePlayerAfter(afterId){
  const n = state.players.length;
  let idx = state.players.findIndex(p => p.id === afterId);
  if(idx === -1) idx = -1; // joueur introuvable (supprimé) : on repart du début de la table
  for(let step=1; step<=n; step++){
    const candidate = (idx + step) % n;
    if(!state.players[candidate].eliminated) return state.players[candidate].id;
  }
  return null;
}

function checkWinConditionOrContinue(){
  const active = state.players.filter(p => !p.eliminated);
  const civils = active.filter(p => p.role==='civil').length;
  const infiltres = active.filter(p => p.role==='undercover' || p.role==='mrwhite').length;

  if(infiltres === 0){
    finishGame('civils');
  } else if(civils <= 1 ? infiltres >= civils : infiltres > civils){
    // Avec 2 joueurs restants (1 civil, 1 infiltré/Bluffeur), un vote n'a plus de sens :
    // l'infiltré gagne directement. Au-dessus de 2 civils restants, on laisse une marge
    // (il faut être strictement plus nombreux) pour ne pas finir sur une seule erreur.
    finishGame('undercover');
  } else {
    // Mauvaise élimination : nouveau tour de description, à partir du joueur suivant
    state.roundNumber = (state.roundNumber || 1) + 1;
    const nextId = state.lastEliminatedId !== null ? getNextActivePlayerAfter(state.lastEliminatedId) : null;
    state.starterId = nextId !== null ? nextId : (active.length ? active[0].id : (state.players[0] && state.players[0].id));
    state.screen = 'starter';
    render();
  }
}

function finishGame(winnerKey){
  state.winner = winnerKey;
  state.players.forEach(p => {
    const entry = getOrCreateRosterEntry(p.name);
    entry.parties += 1;
    let pts = 0;
    if(winnerKey === 'civils' && p.role === 'civil') pts = 2;
    if(winnerKey === 'undercover'){
      if(p.role === 'undercover') pts = 3;
      else if(p.role === 'mrwhite' && !p.eliminated) pts = 3;
    }
    if(winnerKey === 'mrwhite' && p.role === 'mrwhite') pts = 5;
    entry.points += pts;
  });
  saveRosterToStorage();
  state.screen = 'result';
  render();
}

// ---------- RESULT SCREEN ----------
function renderResult(){
  const wrap = el('div','screen center');
  let emoji, title, desc, color, confettiColors;
  if(state.winner === 'civils'){ emoji='🎉'; title='Les Civils gagnent !'; desc='Tous les infiltrés ont été démasqués, bravo !'; color='var(--mint)'; confettiColors=['#30D158','#40C8E0','#FFD60A']; }
  else if(state.winner === 'undercover'){ emoji='🕶️'; title='Les Infiltrés gagnent !'; desc='Ils étaient trop malins, ils ont survécu au vote !'; color='var(--pink)'; confettiColors=['#FF375F','#FF9F0A','#5E5CE6']; }
  else { emoji='🤍'; title='Le Bluffeur gagne !'; desc='Il a deviné le mot secret : ' + state.civilWord + ' !'; color='var(--indigo)'; confettiColors=['#5E5CE6','#EAE7FF','#FF375F']; }

  spawnConfetti(confettiColors);

  const header = el('div','fixed-part center');
  header.appendChild(el('div','result-emoji', emoji));
  const h = el('h1', null, title); h.style.color = color; h.style.fontSize="22px";
  header.appendChild(h);
  header.appendChild(el('div','subtitle', desc));
  wrap.appendChild(header);

  const scrollArea = el('div','scroll-area');

  const revealCard = el('div','card');
  revealCard.appendChild(el('label','field-label','🎭 Qui était qui ?'));
  state.players.forEach(p => {
    const roleLabel = p.role==='civil' ? '👨‍👩‍👧 Civil' : (p.role==='undercover' ? '🕶️ Infiltré' : '🤍 Bluffeur');
    const badgeClass = p.role==='civil' ? 'civil' : (p.role==='undercover' ? 'undercover' : 'mrwhite');
    const wordNote = p.role==='mrwhite' ? '' : ('<span style="font-weight:600;font-size:12px;color:var(--ink-soft);">' + p.word + '</span>');
    const row = el('div','role-row');
    row.innerHTML = '<div class="label">' + escapeHtml(p.name) + '</div>' +
      '<div style="display:flex;align-items:center;gap:8px;">' + wordNote + '<span class="badge ' + badgeClass + '">' + roleLabel + '</span></div>';
    revealCard.appendChild(row);
  });
  scrollArea.appendChild(revealCard);

  const scoreCard = el('div','card');
  scoreCard.appendChild(el('label','field-label','🏆 Scores de la session'));
  const rows = state.players
    .slice()
    .sort((a,b) => {
      const ea = roster.find(r=>r.name.toLowerCase()===a.name.toLowerCase()) || {points:0};
      const eb = roster.find(r=>r.name.toLowerCase()===b.name.toLowerCase()) || {points:0};
      return eb.points - ea.points;
    });
  rows.forEach(p => {
    const entry = roster.find(r => r.name.toLowerCase() === p.name.toLowerCase()) || {parties:0, points:0};
    const row = el('div','role-row');
    row.innerHTML = '<div><div class="label">' + escapeHtml(p.name) + '</div><div class="desc">' + entry.parties + ' parties jouées</div></div><div style="font-weight:800;font-size:16px;color:var(--amber);">' + entry.points + ' pts</div>';
    scoreCard.appendChild(row);
  });
  scrollArea.appendChild(scoreCard);
  scrollArea.appendChild(el('div','footer-note footer-note-dark','Les scores restent affichés tant que tu ne fermes pas le jeu.'));
  wrap.appendChild(scrollArea);

  const footer = el('div','fixed-part');
  const replay = el('div','btn btn-primary','🔁 Rejouer avec les mêmes joueurs');
  footer.appendChild(replay);
  replay.onclick = guardOnce(() => { startGame(); });

  const newGame = el('div','btn btn-ghost','⚙️ Nouvelle configuration');
  newGame.style.marginTop = '8px';
  newGame.onclick = () => { state.screen = 'setup'; render(); };
  footer.appendChild(newGame);
  wrap.appendChild(footer);

  return wrap;
}

try{
  render();
}catch(e){
  console.error('Erreur au premier affichage', e);
}

// Verrouille le zoom (pincement, double-tap) au cas où le navigateur ignorerait le viewport
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('gesturechange', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => { if(e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if(now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
</script>
